<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>机器人控制</title>
<style>
:root{--green:#3ac15a;--red:#e0524d;--orange:#f0a500;--bg:#0f1115;--card:#1a1d24;--txt:#e6e6e6;--muted:#8a8f98;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;justify-content:center;padding:16px;}
.wrap{width:100%;max-width:480px;display:flex;flex-direction:column;gap:16px;}
.card{background:var(--card);border-radius:14px;padding:16px;}
h1{font-size:18px;text-align:center;font-weight:600;}
.row{display:flex;gap:8px;align-items:center;}
input[type=text]{flex:1;background:#0b0d12;border:1px solid #2a2f3a;border-radius:8px;padding:10px 12px;color:var(--txt);font-size:15px;outline:none;}
input[type=text]:focus{border-color:#3a6ea5;}
button{cursor:pointer;border:none;border-radius:8px;padding:10px 14px;font-size:15px;font-weight:600;}
.btn-test{background:#2d3748;color:var(--txt);}
.btn-test:active{background:#1f2733;}
.status{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:12px;}
.dot{width:10px;height:10px;border-radius:50%;background:var(--red);}
.dot.online{background:var(--green);}
.dot.checking{background:var(--orange);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.act{padding:18px 0;font-size:17px;color:#fff;}
.act:active{transform:scale(.97);}
.act.squat{background:#3b82f6;}
.act.stand{background:#22c55e;}
.act.wave{background:#a855f7;}
.act.bow{background:#f59e0b;}
.act:disabled{opacity:.5;cursor:not-allowed;}
.log{background:#0b0d12;border-radius:10px;padding:10px;height:200px;overflow-y:auto;font-family:ui-monospace,Consolas,Menlo,monospace;font-size:12.5px;line-height:1.6;}
.log .l{white-space:pre-wrap;word-break:break-all;}
.log .send{color:#7aa2f7;}
.log .ok{color:var(--green);}
.log .err{color:var(--red);}
.log .info{color:var(--muted);}
.title-row{display:flex;justify-content:space-between;align-items:center;}
.clear{background:transparent;color:var(--muted);font-size:12px;padding:4px 8px;}
@media (max-width:360px){.act{font-size:15px;padding:16px 0;}}
</style>
</head>
<body>
<div class="wrap">
  <h1>机器人控制</h1>
  <div class="card">
    <div class="row">
      <input type="text" id="ip" placeholder="电脑 IP，如 192.168.1.100" autocomplete="off">
      <button class="btn-test" id="testBtn">连接测试</button>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">离线</span></div>
  </div>
  <div class="card">
    <div class="actions">
      <button class="act squat" data-action="下蹲">下蹲</button>
      <button class="act stand" data-action="站立">站立</button>
      <button class="act wave" data-action="挥手">挥手</button>
      <button class="act bow" data-action="鞠躬">鞠躬</button>
    </div>
  </div>
  <div class="card">
    <div class="title-row"><span>日志</span><button class="clear" id="clearBtn">清空</button></div>
    <div class="log" id="log"></div>
  </div>
</div>
<script>
var ipInput=document.getElementById('ip');
var dot=document.getElementById('dot');
var statusText=document.getElementById('statusText');
var logEl=document.getElementById('log');
var baseUrl='';
var hbTimer=null;

function setStatus(s){
  dot.className='dot'+(s==='online'?' online':s==='checking'?' checking':'');
  statusText.textContent=s==='online'?'在线':s==='checking'?'检测中':'离线';
}
function now(){var d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');}
function log(msg,type){var div=document.createElement('div');div.className='l '+(type||'info');div.textContent='['+now()+'] '+msg;logEl.insertBefore(div,logEl.firstChild);while(logEl.childNodes.length>200)logEl.removeChild(logEl.lastChild);}
function stopHb(){if(hbTimer){clearInterval(hbTimer);hbTimer=null;}}

async function testConnection(){
  var ip=ipInput.value.trim();
  if(!ip){log('请输入电脑 IP 地址','err');return;}
  baseUrl='http://'+ip+':8080';
  setStatus('checking');
  try{
    var r=await fetch(baseUrl+'/api/command',{method:'OPTIONS'});
    if(r.ok){setStatus('online');startHb();log('已连接 '+baseUrl,'info');}
    else{setStatus('offline');stopHb();log('连接失败，HTTP '+r.status,'err');}
  }catch(e){setStatus('offline');stopHb();log('无法连接服务器：'+e,'err');}
}
function startHb(){stopHb();hbTimer=setInterval(async()=>{try{var r=await fetch(baseUrl+'/api/command',{method:'OPTIONS'});if(!r.ok){setStatus('offline');stopHb();log('连接已断开','err');}}catch(e){setStatus('offline');stopHb();log('连接已断开','err');}},5000);}

async function sendAction(btn){
  var action=btn.getAttribute('data-action');
  if(!baseUrl){log('请先进行连接测试','err');return;}
  btn.disabled=true;
  log('发送指令：'+action,'send');
  try{
    var r=await fetch(baseUrl+'/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:action})});
    var data={};try{data=await r.json();}catch(e){}
    if(r.ok){log(action+' 成功：'+JSON.stringify(data.result!==undefined?data.result:data),'ok');}
    else{log(action+' 失败：'+(data.error||('HTTP '+r.status)),'err');}
  }catch(e){log(action+' 请求失败：'+e,'err');}
  finally{btn.disabled=false;}
}

document.getElementById('testBtn').addEventListener('click',testConnection);
document.getElementById('clearBtn').addEventListener('click',function(){logEl.innerHTML='';});
document.querySelectorAll('.act').forEach(function(b){b.addEventListener('click',function(){sendAction(b);});});
ipInput.addEventListener('keydown',function(e){if(e.key==='Enter')testConnection();});
</script>
</body>
</html>
